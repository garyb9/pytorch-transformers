seed: 42

tokenizer:
  vocab_size: 32000
  sample_size: 4000000

filters:
  seq_len: 256
  max_length_ratio: 3.0

own_eval:
  dev_fraction: 0.0007
  test_fraction: 0.0007

sources:
  - id: jesc
    hub_id: nntsuzu/JESC
    config: null
    split: train
    src_field: translation.en
    tgt_field: translation.ja
    weight: 0.7
    max_examples: null
    license: cc-by-4.0
    attribution: "JESC (Pryzant et al., 2018), CC BY-SA 4.0"

  - id: opus100
    hub_id: Helsinki-NLP/opus-100
    config: en-ja
    split: train
    validation_split: validation
    test_split: test
    src_field: translation.en
    tgt_field: translation.ja
    weight: 0.3
    max_examples: null
    license: unknown
    attribution: "OPUS-100 (Zhang et al., 2020), research use"

  - id: jlpt-grammar
    format: csv
    path: ../nihongo-go/data/jlptsensei/grammar/n*.examples.csv
    src_field: english
    tgt_field: japanese
    level_field: level
    weight: 0.012
    eval_fraction: 0.1
    optional: true
    license: unknown
    attribution: "JLPT Sensei grammar examples (local nihongo-go corpus)"

  - id: jlpt-core2000
    format: csv
    path: ../nihongo-go/data/vocab/export/Japanese_Core_2000_2k_-_Sorted_w_Audio.csv
    src_field: sentence_english
    tgt_field: expression
    weight: 0.004
    eval_fraction: 0.1
    optional: true
    license: unknown
    attribution: "Japanese Core 2000 (Anki export)"

  - id: jlpt-grammar6500
    format: csv
    path: ../nihongo-go/data/grammar/export/Japanese_Grammar_6500_Example_sentences_for_all_850_GrPoints.csv
    src_field: example_english
    tgt_field: example_japanese
    level_field: level
    weight: 0.004
    optional: true
    license: unknown
    attribution: "JLPT grammar 6500 example sentences (Anki export)"