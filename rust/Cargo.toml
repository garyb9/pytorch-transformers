[package]
name = "pytorch-transformers-rs"
version = "0.1.0"
edition = "2021"
description = "Rust/candle port of the pytorch-transformers EN<->JP playground"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
candle-core = "0.11.0"
candle-nn = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
memmap2 = "0.9.11"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokenizers = "0.23.2"

[features]
default = []
cuda = ["candle-core/cuda"]
